name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and enforce coverage
        working-directory: backend-java
        run: ./mvnw --batch-mode verify
      - name: Upload Java reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: |
            backend-java/target/surefire-reports/
            backend-java/target/site/jacoco/
          if-no-files-found: ignore

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-python/requirements.lock.txt
            ai-python/requirements-dev.txt
      - name: Install dependencies
        working-directory: ai-python
        run: pip install -r requirements.lock.txt -r requirements-dev.txt
      - name: Test and enforce coverage
        working-directory: ai-python
        run: python -m pytest --junitxml=pytest-results.xml --cov-report=xml
      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-reports
          path: |
            ai-python/pytest-results.xml
            ai-python/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests and coverage
        working-directory: frontend
        run: npm run test:unit:coverage
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-reports
          path: |
            frontend/coverage/
            frontend/dist/
          if-no-files-found: ignore

  e2e:
    name: Docker Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: smartaudit-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_HOST_PORT: "13306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create CI-only environment files
        shell: bash
        run: |
          cp ai-python/.env.example ai-python/.env
          cp env.deploy.example env.deploy
      - name: Build and start E2E services
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build mock-llm ai backend frontend
      - name: Wait for healthy services
        shell: bash
        run: |
          for _ in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 backend ai mysql
          exit 1
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Capture service logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > e2e-services.log
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            e2e-services.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop E2E services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans
