name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to validate
        required: true
        type: string

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      COMPOSE_PROJECT_NAME: smartaudit-release-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_HOST_PORT: "13306"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-python/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate release version
        run: bash scripts/verify-version.sh "$RELEASE_TAG"
      - name: Test Java
        working-directory: backend-java
        run: ./mvnw --batch-mode verify
      - name: Test Python
        working-directory: ai-python
        run: |
          pip install -r requirements.lock.txt -r requirements-dev.txt
          python -m pytest
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit:coverage
          npm run lint
          npm run build
      - name: Create E2E environment
        run: |
          cp ai-python/.env.example ai-python/.env
          cp env.deploy.example env.deploy
      - name: Run Docker E2E services
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build mock-llm ai backend frontend
      - name: Wait for E2E services
        run: |
          for _ in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Stop E2E services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release images
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          mkdir -p release-artifacts
          for service in backend ai frontend; do
            case "$service" in
              backend) context=backend-java ;;
              ai) context=ai-python ;;
              frontend) context=frontend ;;
            esac
            image="ghcr.io/$repo-$service:$version"
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$version" -t "$image" "$context"
            docker push "$image"
            docker image inspect "$image" --format '{{index .RepoDigests 0}}' >> release-artifacts/image-digests.txt
            echo "$image" >> release-artifacts/images.txt
          done
      - name: Scan images and generate SBOMs
        shell: bash
        run: |
          while IFS= read -r image; do
            name="${image##*-}"
            name="${name%%:*}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.63.0 \
              image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.18.1 \
              "$image" -o cyclonedx-json > "release-artifacts/$name.sbom.json"
          done < release-artifacts/images.txt
      - name: Create and inspect source archive
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          git archive --format=tar.gz --prefix="smartaudit-$version/" \
            --output="release-artifacts/smartaudit-$version.tar.gz" "$RELEASE_TAG"
          mkdir release-check
          tar -xzf "release-artifacts/smartaudit-$version.tar.gz" -C release-check --strip-components=1
          bash scripts/check-release-contents.sh release-check
          (cd release-artifacts && sha256sum -- ./* > SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-artifacts/*
      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-diagnostics
          path: |
            frontend/test-results/
            release-artifacts/
          if-no-files-found: ignore
