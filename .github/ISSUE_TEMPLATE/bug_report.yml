name: Bug report
description: Report a reproducible SmartAudit-AI defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real contracts, credentials, logs containing secrets, or personal data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic data.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations: { required: true }
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Windows scripts, Linux/macOS scripts, Other]
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove tokens, contract text, personal data, and internal URLs.

